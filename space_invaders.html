<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Space Invaders</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        #gameContainer {
            border: 2px solid #00FF00;
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }
        
        canvas {
            display: block;
            background: #000;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #gameUI {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00FF00;
            font-size: 18px;
            z-index: 10;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #FF0000;
            font-size: 24px;
            display: none;
            z-index: 20;
        }
        
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #00FF00;
            font-size: 14px;
        }
        
        #mobileControls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            z-index: 30;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .control-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #00FF00;
            background: rgba(0, 255, 0, 0.1);
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(0, 255, 0, 0.3);
        }
        
        #leftBtn {
            left: 20px;
            bottom: 30px;
        }
        
        #rightBtn {
            left: 100px;
            bottom: 30px;
        }
        
        #shootBtn {
            right: 20px;
            bottom: 30px;
            width: 80px;
            height: 80px;
            font-size: 14px;
        }
        
        #pauseBtn {
            right: 80px;
            top: 20px;
            width: 50px;
            height: 50px;
            font-size: 12px;
        }
        
        #versionLabel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #00FF00;
            font-size: 12px;
            opacity: 0.7;
            z-index: 10;
        }
        
        #audioControls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        
        #muteBtn {
            width: 50px;
            height: 50px;
            border: 2px solid #00FF00;
            background: rgba(0, 255, 0, 0.1);
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        #muteBtn:hover {
            background: rgba(0, 255, 0, 0.2);
        }
        
        #muteBtn.muted {
            background: rgba(255, 0, 0, 0.2);
            border-color: #FF0000;
            color: #FF0000;
        }
        
        @media (max-width: 768px) {
            #mobileControls {
                display: flex !important;
            }
            
            #instructions {
                display: none;
            }
            
            #versionLabel {
                bottom: 130px;
            }
            
            #gameContainer {
                border: none;
            }
            
            canvas {
                width: 100vw;
                height: calc(100vh - 120px);
            }
        }
        
        @media (orientation: landscape) {
            body {
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }
            
            #gameContainer {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            
            canvas {
                width: auto;
                height: 100vh;
                max-width: 100vw;
                object-fit: contain;
            }
            
            #mobileControls {
                display: none !important;
            }
            
            #leftBtn {
                position: fixed !important;
                right: 160px !important;
                top: 50% !important;
                transform: translateY(-50%) !important;
                width: 60px !important;
                height: 60px !important;
                font-size: 18px !important;
                z-index: 1000 !important;
                display: flex !important;
                background: rgba(255, 0, 0, 0.8) !important;
                border: 3px solid #FF0000 !important;
                color: white !important;
            }
            
            #rightBtn {
                position: fixed !important;
                right: 80px !important;
                top: 50% !important;
                transform: translateY(-50%) !important;
                width: 60px !important;
                height: 60px !important;
                font-size: 18px !important;
                z-index: 1000 !important;
                display: flex !important;
                background: rgba(255, 0, 0, 0.8) !important;
                border: 3px solid #FF0000 !important;
                color: white !important;
            }
            
            #shootBtn {
                position: fixed !important;
                right: 120px !important;
                top: 70% !important;
                transform: translateY(-50%) !important;
                width: 80px !important;
                height: 80px !important;
                font-size: 16px !important;
                z-index: 1000 !important;
                display: flex !important;
                background: rgba(255, 255, 0, 0.9) !important;
                border: 3px solid #FFFF00 !important;
                color: black !important;
            }
            
            #pauseBtn {
                position: fixed;
                right: 20px;
                top: 15px;
                width: 40px;
                height: 40px;
                font-size: 12px;
                z-index: 1000;
            }
            
            #audioControls {
                position: fixed;
                right: 20px;
                top: 65px;
                z-index: 1000;
            }
            
            #muteBtn {
                width: 40px;
                height: 40px;
                font-size: 12px;
            }
            
            #versionLabel {
                position: fixed;
                bottom: 10px;
                left: 20px;
                font-size: 12px;
                z-index: 1000;
                background: rgba(0, 0, 0, 0.7);
                padding: 5px;
                border-radius: 3px;
            }
            
            #gameUI {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 110;
            }
            
            #instructions {
                display: none;
            }
        }
        
        @media (orientation: landscape) and (min-width: 769px) {
            body {
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }
            
            #gameContainer {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            canvas {
                width: auto;
                height: 100vh;
                max-width: calc(100vh * 4/3);
                object-fit: contain;
            }
            
            #mobileControls {
                display: none !important;
            }
            
            #pauseBtn {
                right: 20px;
                top: 80px;
            }
            
            #audioControls {
                right: 20px;
                top: 20px;
            }
            
            #versionLabel {
                bottom: 10px;
                right: 20px;
            }
            
            #gameUI {
                top: 10px;
                left: 20px;
                z-index: 15;
            }
            
            #instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameUI">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Level: <span id="level">1</span></div>
        </div>
        <div id="gameOver">
            <div>GAME OVER</div>
            <div id="restartInstruction">Press SPACE to restart</div>
        </div>
        <div id="instructions">
            Use ← → arrows to move • SPACE to shoot • ESC to pause • Click 🔊 to mute
        </div>
        
        <div id="mobileControls">
            <div id="leftBtn" class="control-btn">←</div>
            <div id="rightBtn" class="control-btn">→</div>
            <div id="shootBtn" class="control-btn">FIRE</div>
        </div>
        
        <div id="pauseBtn" class="control-btn">⏸</div>
        
        <div id="audioControls">
            <div id="muteBtn">🔊</div>
        </div>
        
        <div id="versionLabel">v4.7 Mobile & Sound<br><div style="text-align: right;">时力</div></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Mobile detection and setup
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let canvasScale = 1;
        
        function setupCanvas() {
            if (isMobile) {
                const container = document.getElementById('gameContainer');
                const mobileControls = document.getElementById('mobileControls');
                const isLandscape = window.innerWidth > window.innerHeight;
                
                if (isLandscape) {
                    // Landscape mode: canvas takes most width, controls on right
                    canvas.style.width = 'auto';
                    canvas.style.height = '100vh';
                    canvas.style.maxWidth = 'calc(100vh * 4/3)';
                } else {
                    // Portrait mode: canvas takes most height, controls at bottom
                    const controlHeight = window.innerHeight <= 500 ? 80 : 120;
                    canvas.style.width = '100vw';
                    canvas.style.height = `calc(100vh - ${controlHeight}px)`;
                    canvas.style.maxWidth = '100vw';
                }
                
                // Calculate scale for touch coordinates
                const rect = canvas.getBoundingClientRect();
                canvasScale = canvas.width / rect.width;
                
                // Update restart instruction for mobile
                document.getElementById('restartInstruction').textContent = 'Press FIRE to restart';
            }
        }
        
        // Touch handling variables
        let touchState = {
            left: false,
            right: false,
            shoot: false
        };
        
        // Audio system
        class AudioManager {
            constructor() {
                this.sounds = {};
                this.isMuted = false;
                // Increase volume for mobile speakers
                this.masterVolume = isMobile ? 0.6 : 0.3;
                this.musicVolume = isMobile ? 0.4 : 0.2;
                this.lastVolumeUpdate = 0;
                this.audioContextResumed = false;
                this.initAudio();
            }
            
            initAudio() {
                // Create audio contexts and oscillators for retro sounds
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Force audio context to resume (required for mobile)
                this.resumeAudioContext();
                
                // Background music
                this.createBackgroundMusic();
                
                // Sound effects
                this.setupSoundEffects();
            }
            
            resumeAudioContext() {
                if (this.audioContext.state === 'suspended') {
                    this.audioContext.resume().then(() => {
                        console.log('Audio context resumed');
                        this.audioContextResumed = true;
                    });
                }
                
                // Set audio context to route to speakers for mobile
                if (this.audioContext.destination) {
                    this.audioContext.destination.channelCount = 2;
                    this.audioContext.destination.channelCountMode = 'explicit';
                    this.audioContext.destination.channelInterpretation = 'speakers';
                }
            }
            
            ensureAudioContextActive() {
                if (this.audioContext.state === 'suspended') {
                    this.resumeAudioContext();
                }
                return this.audioContext.state === 'running';
            }
            
            createBackgroundMusic() {
                // Simple background music loop
                this.musicGain = this.audioContext.createGain();
                this.musicGain.gain.value = this.musicVolume;
                this.musicGain.connect(this.audioContext.destination);
                
                this.startBackgroundMusic();
            }
            
            updateBackgroundMusicVolume(bottomMostInvaderY = 0, playerY = 0) {
                if (this.isMuted || !this.musicGain) return;
                
                // Throttle updates to prevent too many rapid changes
                const now = this.audioContext.currentTime;
                if (now - this.lastVolumeUpdate < 0.1) return; // Update max every 0.1 seconds
                this.lastVolumeUpdate = now;
                
                // Calculate proximity-based volume using bottom-most invader
                const gameHeight = 600;
                const safePlayerY = playerY || (gameHeight - 50); // Player near bottom (around Y=550)
                const safeInvaderY = bottomMostInvaderY || 100; // Default invader near top
                
                // Distance calculation: player Y - bottom invader Y 
                const distanceFromPlayer = Math.max(0, safePlayerY - safeInvaderY);
                const maxDistance = 350; // Adjusted for better scaling
                
                // More aggressive proximity ratio calculation
                let proximityRatio = 1 - Math.min(distanceFromPlayer / maxDistance, 1);
                
                // Apply exponential curve for more dramatic changes
                proximityRatio = Math.pow(proximityRatio, 0.6); // Even more dramatic curve
                proximityRatio = Math.max(proximityRatio, 0.15); // Slightly higher minimum
                
                // Much more dramatic volume scaling
                const minVolume = this.musicVolume * 0.15; // 15% of original when far (very quiet)
                const maxVolume = this.musicVolume * 2.0; // 200% of original when very close (much louder)
                const targetVolume = minVolume + (proximityRatio * (maxVolume - minVolume));
                
                // Set volume immediately for more responsive feel
                this.musicGain.gain.setValueAtTime(targetVolume, this.audioContext.currentTime);
            }
            
            startBackgroundMusic() {
                if (this.isMuted) return;
                
                const playMusic = () => {
                    const oscillator = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    oscillator.connect(gain);
                    gain.connect(this.musicGain);
                    
                    // Simple melody pattern
                    const notes = [220, 246.94, 261.63, 293.66, 329.63, 246.94, 220, 196];
                    let noteIndex = 0;
                    
                    oscillator.frequency.value = notes[noteIndex];
                    oscillator.type = 'square';
                    
                    gain.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(0.05, this.audioContext.currentTime + 0.1);
                    gain.gain.linearRampToValueAtTime(0, this.audioContext.currentTime + 0.8);
                    
                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + 0.8);
                    
                    setTimeout(() => {
                        if (!this.isMuted && !gameState.isGameOver) {
                            playMusic();
                        }
                    }, 800);
                };
                
                playMusic();
            }
            
            setupSoundEffects() {
                // All sound effects will be generated procedurally
            }
            
            playShoot() {
                if (this.isMuted || !this.ensureAudioContextActive()) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                
                oscillator.connect(gain);
                gain.connect(this.audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, this.audioContext.currentTime + 0.1);
                oscillator.type = 'square';
                
                gain.gain.setValueAtTime(this.masterVolume * 0.3, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.1);
            }
            
            playExplosion() {
                if (this.isMuted || !this.ensureAudioContextActive()) return;
                
                // Create explosion sound with noise
                const bufferSize = this.audioContext.sampleRate * 0.3;
                const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const output = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                
                const noise = this.audioContext.createBufferSource();
                const gain = this.audioContext.createGain();
                const filter = this.audioContext.createBiquadFilter();
                
                noise.buffer = buffer;
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.audioContext.destination);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.audioContext.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, this.audioContext.currentTime + 0.3);
                
                gain.gain.setValueAtTime(this.masterVolume * 0.4, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                
                noise.start(this.audioContext.currentTime);
                noise.stop(this.audioContext.currentTime + 0.3);
            }
            
            playInvaderMove(dropCount = 0, closestInvaderY = 0, playerY = 0) {
                if (this.isMuted || !this.ensureAudioContextActive()) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                
                oscillator.connect(gain);
                gain.connect(this.audioContext.destination);
                
                // Calculate distance-based intensity with better mobile compatibility
                const gameHeight = 600; // Canvas height
                const safePlayerY = playerY || (gameHeight - 50); // Fallback if player Y is missing
                const safeInvaderY = closestInvaderY || 100; // Fallback if invader Y is missing
                
                const distanceFromPlayer = Math.max(0, safePlayerY - safeInvaderY);
                const maxDistance = gameHeight - 150; // Adjusted for better scaling
                let proximityRatio = 1 - Math.min(distanceFromPlayer / maxDistance, 1);
                
                // Ensure minimum proximity effect and better scaling
                proximityRatio = Math.max(proximityRatio, 0.1); // Minimum 10% proximity
                proximityRatio = Math.min(proximityRatio, 1.0); // Maximum 100% proximity
                
                // More dramatic volume scaling
                let baseVolume;
                if (dropCount < 5) {
                    // Start even quieter but more noticeable progression
                    baseVolume = 0.015 + (dropCount * 0.008); 
                } else if (dropCount < 10) {
                    // Medium intensity
                    baseVolume = 0.055 + ((dropCount - 5) * 0.012);
                } else {
                    // High intensity
                    baseVolume = 0.115 + ((dropCount - 10) * 0.020);
                }
                
                // Apply more dramatic proximity multiplier
                let volumeMultiplier = baseVolume * (0.2 + (proximityRatio * 3.0)); // 0.2x to 3.2x based on distance
                volumeMultiplier = Math.min(volumeMultiplier, 0.5); // Higher cap for mobile
                
                // Ensure minimum audible volume
                volumeMultiplier = Math.max(volumeMultiplier, 0.02);
                
                // Frequency increases with proximity and drops for growing tension
                const baseFreq = 100;
                const proximityFreqBoost = proximityRatio * 100; // Up to 100Hz boost when close
                const dropFreqBoost = dropCount * 4; // 4Hz per drop
                const frequency = baseFreq + proximityFreqBoost + dropFreqBoost;
                
                // Make sound more menacing when close
                const soundType = proximityRatio > 0.6 ? 'sawtooth' : 'square';
                
                oscillator.frequency.value = frequency;
                oscillator.type = soundType;
                
                // Longer duration when closer for more dramatic effect
                const duration = 0.1 + (proximityRatio * 0.06); // 0.1s to 0.16s
                
                gain.gain.setValueAtTime(this.masterVolume * volumeMultiplier, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            }
            
            playGameOver() {
                if (this.isMuted || !this.ensureAudioContextActive()) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                
                oscillator.connect(gain);
                gain.connect(this.audioContext.destination);
                
                oscillator.frequency.setValueAtTime(440, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(110, this.audioContext.currentTime + 1.5);
                oscillator.type = 'triangle';
                
                gain.gain.setValueAtTime(this.masterVolume * 0.3, this.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 1.5);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 1.5);
            }
            
            playLevelUp() {
                if (this.isMuted || !this.ensureAudioContextActive()) return;
                
                const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C
                
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        const oscillator = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();
                        
                        oscillator.connect(gain);
                        gain.connect(this.audioContext.destination);
                        
                        oscillator.frequency.value = freq;
                        oscillator.type = 'triangle';
                        
                        gain.gain.setValueAtTime(this.masterVolume * 0.2, this.audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.3);
                    }, index * 150);
                });
            }
            
            toggleMute() {
                this.isMuted = !this.isMuted;
                const muteBtn = document.getElementById('muteBtn');
                
                if (this.isMuted) {
                    muteBtn.textContent = '🔇';
                    muteBtn.classList.add('muted');
                    // Stop background music
                    if (this.musicGain) {
                        this.musicGain.gain.setValueAtTime(0, this.audioContext.currentTime);
                    }
                } else {
                    muteBtn.textContent = '🔊';
                    muteBtn.classList.remove('muted');
                    // Resume background music
                    if (this.musicGain) {
                        this.musicGain.gain.setValueAtTime(this.musicVolume, this.audioContext.currentTime);
                    }
                    if (!gameState.isGameOver) {
                        this.startBackgroundMusic();
                    }
                }
            }
        }
        
        // Initialize audio manager
        let audioManager;
        
        // Game constants
        const GAME_WIDTH = canvas.width;
        const GAME_HEIGHT = canvas.height;
        const PLAYER_SPEED = 4.5;
        const BULLET_SPEED = 6.5;
        const INVADER_SPEED = 0.7;
        const INVADER_DROP_SPEED = 17.1;
        
        // Game state
        let gameState = {
            player: null,
            bullets: [],
            invaders: [],
            invaderBullets: [],
            barriers: [],
            particles: [],
            score: 0,
            lives: 3,
            level: 1,
            isGameOver: false,
            isPaused: false,
            invaderDirection: 1,
            invaderDropTimer: 0,
            shootCooldown: 0,
            invaderShootTimer: 0,
            currentInvaderSpeed: INVADER_SPEED,
            invaderDropCount: 0
        };
        
        // Input handling
        const keys = {};
        
        // Player class
        class Player {
            constructor() {
                this.x = GAME_WIDTH / 2 - 15;
                this.y = GAME_HEIGHT - 50;
                this.width = 30;
                this.height = 20;
                this.speed = PLAYER_SPEED;
            }
            
            update() {
                if (keys['ArrowLeft'] && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keys['ArrowRight'] && this.x < GAME_WIDTH - this.width) {
                    this.x += this.speed;
                }
                
                if (keys[' '] && gameState.shootCooldown <= 0) {
                    this.shoot();
                    // Shooting speed increases by 2% per level (lower cooldown = faster shooting)
                    const baseShootCooldown = 15;
                    const speedIncrease = 1 - ((gameState.level - 1) * 0.02); // 2% faster per level
                    gameState.shootCooldown = Math.max(baseShootCooldown * speedIncrease, 5); // Minimum 5 frames
                }
                
                if (gameState.shootCooldown > 0) {
                    gameState.shootCooldown--;
                }
            }
            
            shoot() {
                gameState.bullets.push(new Bullet(
                    this.x + this.width / 2 - 2,
                    this.y,
                    -BULLET_SPEED,
                    '#00FF00'
                ));
                audioManager.playShoot();
            }
            
            draw() {
                // Draw classic player ship with better visibility
                ctx.fillStyle = '#00FF00';
                
                // Main triangular body
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                
                // Add a base rectangle for stability
                ctx.fillRect(this.x + 5, this.y + this.height - 5, this.width - 10, 5);
                
                // Add wing details
                ctx.fillRect(this.x, this.y + this.height - 8, 8, 3);
                ctx.fillRect(this.x + this.width - 8, this.y + this.height - 8, 8, 3);
            }
        }
        
        // Bullet class
        class Bullet {
            constructor(x, y, speed, color = '#00FF00') {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.color = color;
                this.width = 4;
                this.height = 8;
            }
            
            update() {
                this.y += this.speed;
                return this.y > -10 && this.y < GAME_HEIGHT + 10;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }
        
        // Invader class
        class Invader {
            constructor(x, y, type = 0) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 20;
                this.type = type;
                this.animFrame = 0;
                this.animTimer = 0;
                this.points = [40, 20, 10][type] || 10;
            }
            
            update() {
                this.animTimer++;
                if (this.animTimer >= 30) {
                    this.animFrame = 1 - this.animFrame;
                    this.animTimer = 0;
                }
                
                // Random shooting
                if (Math.random() < 0.0005) {
                    this.shoot();
                }
            }
            
            shoot() {
                gameState.invaderBullets.push(new Bullet(
                    this.x + this.width / 2 - 2,
                    this.y + this.height,
                    3,
                    '#FF0000'
                ));
            }
            
            draw() {
                ctx.fillStyle = ['#FF00FF', '#00FFFF', '#FFFF00'][this.type] || '#FFFF00';
                
                const frame = this.animFrame;
                
                if (this.type === 0) { // Top row - octopus
                    this.drawOctopus(frame);
                } else if (this.type === 1) { // Middle row - crab
                    this.drawCrab(frame);
                } else { // Bottom row - squid
                    this.drawSquid(frame);
                }
            }
            
            drawOctopus(frame) {
                const x = this.x;
                const y = this.y;
                
                // Body
                ctx.fillRect(x + 8, y + 4, 14, 8);
                ctx.fillRect(x + 6, y + 6, 18, 4);
                
                // Eyes
                ctx.fillRect(x + 9, y + 6, 2, 2);
                ctx.fillRect(x + 19, y + 6, 2, 2);
                
                // Tentacles (animated)
                if (frame === 0) {
                    ctx.fillRect(x + 2, y + 12, 2, 4);
                    ctx.fillRect(x + 8, y + 12, 2, 6);
                    ctx.fillRect(x + 14, y + 12, 2, 4);
                    ctx.fillRect(x + 20, y + 12, 2, 6);
                    ctx.fillRect(x + 26, y + 12, 2, 4);
                } else {
                    ctx.fillRect(x + 4, y + 12, 2, 6);
                    ctx.fillRect(x + 10, y + 12, 2, 4);
                    ctx.fillRect(x + 16, y + 12, 2, 6);
                    ctx.fillRect(x + 22, y + 12, 2, 4);
                    ctx.fillRect(x + 24, y + 12, 2, 6);
                }
            }
            
            drawCrab(frame) {
                const x = this.x;
                const y = this.y;
                
                // Body
                ctx.fillRect(x + 6, y + 8, 18, 6);
                ctx.fillRect(x + 4, y + 10, 22, 2);
                
                // Eyes
                ctx.fillRect(x + 8, y + 6, 2, 4);
                ctx.fillRect(x + 20, y + 6, 2, 4);
                
                // Claws (animated)
                if (frame === 0) {
                    ctx.fillRect(x, y + 8, 4, 2);
                    ctx.fillRect(x + 26, y + 8, 4, 2);
                    ctx.fillRect(x + 8, y + 14, 2, 4);
                    ctx.fillRect(x + 20, y + 14, 2, 4);
                } else {
                    ctx.fillRect(x + 2, y + 6, 4, 2);
                    ctx.fillRect(x + 24, y + 6, 4, 2);
                    ctx.fillRect(x + 10, y + 14, 2, 4);
                    ctx.fillRect(x + 18, y + 14, 2, 4);
                }
            }
            
            drawSquid(frame) {
                const x = this.x;
                const y = this.y;
                
                // Body
                ctx.fillRect(x + 8, y + 6, 14, 8);
                
                // Eyes
                ctx.fillRect(x + 10, y + 8, 2, 2);
                ctx.fillRect(x + 18, y + 8, 2, 2);
                
                // Legs (animated)
                if (frame === 0) {
                    ctx.fillRect(x + 6, y + 14, 2, 4);
                    ctx.fillRect(x + 10, y + 14, 2, 2);
                    ctx.fillRect(x + 14, y + 14, 2, 4);
                    ctx.fillRect(x + 18, y + 14, 2, 2);
                    ctx.fillRect(x + 22, y + 14, 2, 4);
                } else {
                    ctx.fillRect(x + 8, y + 14, 2, 2);
                    ctx.fillRect(x + 12, y + 14, 2, 4);
                    ctx.fillRect(x + 16, y + 14, 2, 2);
                    ctx.fillRect(x + 20, y + 14, 2, 4);
                }
            }
        }
        
        // Barrier class
        class Barrier {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 40;
                this.blocks = [];
                this.initBlocks();
            }
            
            initBlocks() {
                // Create barrier shape
                const pattern = [
                    "111111111111",
                    "111111111111",
                    "111111111111",
                    "111000000111",
                    "111000000111",
                    "100000000001"
                ];
                
                for (let row = 0; row < pattern.length; row++) {
                    this.blocks[row] = [];
                    for (let col = 0; col < pattern[row].length; col++) {
                        this.blocks[row][col] = pattern[row][col] === '1';
                    }
                }
            }
            
            checkCollision(bullet) {
                const relX = bullet.x - this.x;
                const relY = bullet.y - this.y;
                
                if (relX < 0 || relX >= this.width || relY < 0 || relY >= this.height) {
                    return false;
                }
                
                const blockX = Math.floor(relX / 5);
                const blockY = Math.floor(relY / 6.67);
                
                if (blockY >= 0 && blockY < this.blocks.length && 
                    blockX >= 0 && blockX < this.blocks[blockY].length) {
                    
                    if (this.blocks[blockY][blockX]) {
                        // Destroy block
                        this.blocks[blockY][blockX] = false;
                        return true;
                    }
                }
                return false;
            }
            
            draw() {
                ctx.fillStyle = '#00FF00';
                for (let row = 0; row < this.blocks.length; row++) {
                    for (let col = 0; col < this.blocks[row].length; col++) {
                        if (this.blocks[row][col]) {
                            ctx.fillRect(
                                this.x + col * 5,
                                this.y + row * 6.67,
                                5,
                                6.67
                            );
                        }
                    }
                }
            }
        }
        
        // Particle effect
        class Particle {
            constructor(x, y, color = '#FFFF00') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 30;
                this.maxLife = 30;
                this.color = color;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                return this.life > 0;
            }
            
            draw() {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 2, 2);
                ctx.globalAlpha = 1;
            }
        }
        
        // Initialize game
        function initGame() {
            gameState.player = new Player();
            gameState.bullets = [];
            gameState.invaders = [];
            gameState.invaderBullets = [];
            gameState.barriers = [];
            gameState.particles = [];
            gameState.isGameOver = false;
            gameState.isPaused = false;
            gameState.invaderDirection = 1;
            gameState.invaderDropTimer = 0;
            gameState.invaderDropCount = 0; // Reset drop count
            
            createInvaders();
            createBarriers();
            updateUI();
        }
        
        function createInvaders() {
            gameState.invaders = [];
            const startX = 100;
            const startY = 100;
            const spacingX = 50;
            const spacingY = 40;
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 11; col++) {
                    const type = row < 1 ? 0 : row < 3 ? 1 : 2;
                    gameState.invaders.push(new Invader(
                        startX + col * spacingX,
                        startY + row * spacingY,
                        type
                    ));
                }
            }
        }
        
        function createBarriers() {
            gameState.barriers = [];
            const barrierCount = 4;
            const spacing = GAME_WIDTH / (barrierCount + 1);
            
            for (let i = 0; i < barrierCount; i++) {
                gameState.barriers.push(new Barrier(
                    spacing * (i + 1) - 30,
                    GAME_HEIGHT - 200
                ));
            }
        }
        
        function nextLevel() {
            gameState.level++;
            createInvaders();
            audioManager.playLevelUp();
            
            // Increase difficulty
            for (const invader of gameState.invaders) {
                invader.y += 20;
            }
            
            // Increase invader speed progressively each level
            gameState.currentInvaderSpeed = INVADER_SPEED + (gameState.level - 1) * 0.3;
        }
        
        function checkCollisions() {
            // Player bullets vs invaders
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const bullet = gameState.bullets[i];
                
                for (let j = gameState.invaders.length - 1; j >= 0; j--) {
                    const invader = gameState.invaders[j];
                    
                    if (bullet.x < invader.x + invader.width &&
                        bullet.x + bullet.width > invader.x &&
                        bullet.y < invader.y + invader.height &&
                        bullet.y + bullet.height > invader.y) {
                        
                        // Create explosion particles
                        for (let k = 0; k < 8; k++) {
                            gameState.particles.push(new Particle(
                                invader.x + invader.width / 2,
                                invader.y + invader.height / 2,
                                '#FFFF00'
                            ));
                        }
                        
                        gameState.score += invader.points;
                        gameState.bullets.splice(i, 1);
                        gameState.invaders.splice(j, 1);
                        audioManager.playExplosion();
                        updateUI();
                        break;
                    }
                }
            }
            
            // Invader bullets vs player
            for (let i = gameState.invaderBullets.length - 1; i >= 0; i--) {
                const bullet = gameState.invaderBullets[i];
                
                if (bullet.x < gameState.player.x + gameState.player.width &&
                    bullet.x + bullet.width > gameState.player.x &&
                    bullet.y < gameState.player.y + gameState.player.height &&
                    bullet.y + bullet.height > gameState.player.y) {
                    
                    gameState.invaderBullets.splice(i, 1);
                    gameState.lives--;
                    updateUI();
                    
                    if (gameState.lives <= 0) {
                        gameOver();
                    }
                    break;
                }
            }
            
            // Bullets vs barriers
            for (const barrier of gameState.barriers) {
                for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                    if (barrier.checkCollision(gameState.bullets[i])) {
                        gameState.bullets.splice(i, 1);
                    }
                }
                
                for (let i = gameState.invaderBullets.length - 1; i >= 0; i--) {
                    if (barrier.checkCollision(gameState.invaderBullets[i])) {
                        gameState.invaderBullets.splice(i, 1);
                    }
                }
            }
            
            // Invaders reaching bottom
            for (const invader of gameState.invaders) {
                if (invader.y + invader.height > gameState.player.y) {
                    gameOver();
                    break;
                }
            }
        }
        
        function updateInvaders() {
            let shouldDrop = false;
            
            for (const invader of gameState.invaders) {
                invader.update();
                
                if (gameState.invaderDirection > 0 && invader.x + invader.width > GAME_WIDTH - 20) {
                    shouldDrop = true;
                } else if (gameState.invaderDirection < 0 && invader.x < 20) {
                    shouldDrop = true;
                }
            }
            
            if (shouldDrop) {
                gameState.invaderDirection *= -1;
                gameState.invaderDropCount++; // Increment drop count
                for (const invader of gameState.invaders) {
                    invader.y += INVADER_DROP_SPEED;
                }
                
                // Find bottom-most invader to player for dramatic audio effect
                let bottomMostInvaderY = 0;
                if (gameState.invaders.length > 0) {
                    // Find the lowest Y position (closest to player) - bottom of the formation
                    bottomMostInvaderY = Math.max(...gameState.invaders.map(inv => inv.y + inv.height));
                }
                
                // Ensure we have valid player position
                const playerY = gameState.player ? gameState.player.y : (GAME_HEIGHT - 50);
                
                audioManager.playInvaderMove(
                    gameState.invaderDropCount, 
                    bottomMostInvaderY, 
                    playerY
                );
            } else {
                for (const invader of gameState.invaders) {
                    invader.x += gameState.invaderDirection * gameState.currentInvaderSpeed;
                }
            }
        }
        
        function gameOver() {
            gameState.isGameOver = true;
            document.getElementById('gameOver').style.display = 'block';
            audioManager.playGameOver();
        }
        
        function resetGame() {
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.currentInvaderSpeed = INVADER_SPEED;
            gameState.invaderDropCount = 0; // Reset drop count
            document.getElementById('gameOver').style.display = 'none';
            initGame();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('level').textContent = gameState.level;
        }
        
        // Game loop
        let gameLoopRunning = false;
        function gameLoop() {
            if (gameLoopRunning) return; // Prevent multiple game loops
            gameLoopRunning = true;
            
            if (!gameState.isPaused && !gameState.isGameOver) {
                // Update
                gameState.player.update();
                
                // Update bullets
                gameState.bullets = gameState.bullets.filter(bullet => bullet.update());
                gameState.invaderBullets = gameState.invaderBullets.filter(bullet => bullet.update());
                
                // Update invaders
                updateInvaders();
                
                // Update particles
                gameState.particles = gameState.particles.filter(particle => particle.update());
                
                // Update background music volume based on invader proximity
                if (gameState.invaders.length > 0 && gameState.player) {
                    // Find the bottom-most invader (closest to player)
                    const bottomMostInvaderY = Math.max(...gameState.invaders.map(inv => inv.y + inv.height));
                    audioManager.updateBackgroundMusicVolume(bottomMostInvaderY, gameState.player.y);
                }
                
                // Check collisions
                checkCollisions();
                
                // Check win condition
                if (gameState.invaders.length === 0) {
                    nextLevel();
                }
            }
            
            // Draw
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            if (!gameState.isGameOver) {
                gameState.player.draw();
            }
            
            gameState.bullets.forEach(bullet => bullet.draw());
            gameState.invaderBullets.forEach(bullet => bullet.draw());
            gameState.invaders.forEach(invader => invader.draw());
            gameState.barriers.forEach(barrier => barrier.draw());
            gameState.particles.forEach(particle => particle.draw());
            
            // Draw pause overlay
            if (gameState.isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.fillStyle = '#00FF00';
                ctx.font = '48px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2);
                ctx.textAlign = 'left';
            }
            
            gameLoopRunning = false; // Reset flag for next frame
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === 'Escape') {
                gameState.isPaused = !gameState.isPaused;
            }
            
            if (e.key === ' ' && gameState.isGameOver) {
                resetGame();
            }
            
            e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Mobile touch controls
        let mobileControlsSetup = false;
        function setupMobileControls() {
            if (mobileControlsSetup) return; // Prevent duplicate setup
            mobileControlsSetup = true;
            
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const shootBtn = document.getElementById('shootBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            
            // Left button
            leftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioManager && audioManager.audioContext) {
                    audioManager.resumeAudioContext();
                }
                touchState.left = true;
                keys['ArrowLeft'] = true;
            });
            
            leftBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchState.left = false;
                keys['ArrowLeft'] = false;
            });
            
            // Right button
            rightBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioManager && audioManager.audioContext) {
                    audioManager.resumeAudioContext();
                }
                touchState.right = true;
                keys['ArrowRight'] = true;
            });
            
            rightBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchState.right = false;
                keys['ArrowRight'] = false;
            });
            
            // Shoot button
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioManager && audioManager.audioContext) {
                    audioManager.resumeAudioContext();
                }
                touchState.shoot = true;
                keys[' '] = true;
                if (gameState.isGameOver) {
                    resetGame();
                }
            });
            
            shootBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchState.shoot = false;
                keys[' '] = false;
            });
            
            // Pause button
            let pauseTouchStarted = false;
            
            pauseBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioManager && audioManager.audioContext) {
                    audioManager.resumeAudioContext();
                }
                pauseTouchStarted = true;
            });
            
            pauseBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (pauseTouchStarted) {
                    gameState.isPaused = !gameState.isPaused;
                    pauseTouchStarted = false;
                }
            });
            
            pauseBtn.addEventListener('touchcancel', (e) => {
                pauseTouchStarted = false;
            });
            
            pauseBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!isMobile) {
                    gameState.isPaused = !gameState.isPaused;
                }
            });
            
            // Mute button
            const muteBtn = document.getElementById('muteBtn');
            let muteTouchStarted = false;
            
            muteBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (audioManager && audioManager.audioContext) {
                    audioManager.resumeAudioContext();
                }
                muteTouchStarted = true;
            });
            
            muteBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (muteTouchStarted && audioManager && audioManager.toggleMute) {
                    audioManager.toggleMute();
                    muteTouchStarted = false;
                }
            });
            
            muteBtn.addEventListener('touchcancel', (e) => {
                muteTouchStarted = false;
            });
            
            muteBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!isMobile && audioManager && audioManager.toggleMute) {
                    audioManager.toggleMute();
                }
            });
            
            // Prevent context menu on long press and add touch isolation
            [leftBtn, rightBtn, shootBtn, pauseBtn, muteBtn].forEach(btn => {
                btn.addEventListener('contextmenu', (e) => e.preventDefault());
                // Add touch isolation to prevent interference
                btn.addEventListener('touchmove', (e) => {
                    e.stopPropagation();
                });
            });
        }
        
        // Handle window resize and orientation change
        window.addEventListener('resize', () => {
            setupCanvas();
        });
        
        window.addEventListener('orientationchange', () => {
            // Wait a bit for the orientation change to complete
            setTimeout(() => {
                setupCanvas();
            }, 100);
        });
        
        // Prevent scroll on touch (except for button interactions)
        document.addEventListener('touchmove', (e) => {
            // Only prevent default if not touching control buttons
            const target = e.target;
            if (!target.classList.contains('control-btn') && target.id !== 'muteBtn') {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Initialize audio and start game
        let gameStartedOnce = false;
        function startGame() {
            if (gameStartedOnce) return; // Prevent multiple initializations
            gameStartedOnce = true;
            
            try {
                audioManager = new AudioManager();
            } catch (error) {
                console.log('Audio not supported, continuing without sound');
                // Create a dummy audio manager for browsers that don't support Web Audio API
                audioManager = {
                    playShoot: () => {},
                    playExplosion: () => {},
                    playInvaderMove: (dropCount, closestInvaderY, playerY) => {},
                    playGameOver: () => {},
                    playLevelUp: () => {},
                    updateBackgroundMusicVolume: (bottomMostInvaderY, playerY) => {},
                    toggleMute: () => {
                        const muteBtn = document.getElementById('muteBtn');
                        if (muteBtn.textContent === '🔊') {
                            muteBtn.textContent = '🔇';
                            muteBtn.classList.add('muted');
                        } else {
                            muteBtn.textContent = '🔊';
                            muteBtn.classList.remove('muted');
                        }
                    }
                };
            }
            
            setupCanvas();
            setupMobileControls();
            initGame();
            gameLoop();
        }
        
        // Handle audio context initialization (required for user interaction)
        let gameStarted = false;
        
        function initAudioAndStartGame() {
            if (!gameStarted) {
                gameStarted = true;
                startGame();
            }
        }
        
        // Start game on user interaction (required for audio context)
        document.addEventListener('click', initAudioAndStartGame);
        document.addEventListener('touchstart', (e) => {
            // Ensure audio context is activated on any touch
            if (audioManager && audioManager.audioContext) {
                audioManager.resumeAudioContext();
            }
            initAudioAndStartGame(e);
        });
        document.addEventListener('keydown', initAudioAndStartGame);
        
        // Fallback: start game after a short delay if no interaction
        setTimeout(() => {
            if (!gameStarted) {
                startGame();
            }
        }, 1000);
    </script>
